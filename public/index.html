<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
    <h1>Image Converter</h1>

    <form id="form" class="panel">
        <div class="drop" id="drop">
            <input id="fileInput" type="file" name="files" accept="image/*" multiple />
            <p>Перетащи файлы сюда или нажми, чтобы выбрать</p>
        </div>

        <div id="preview" class="preview-grid" hidden></div>

        <div class="row">
            <label>Формат вывода:</label>
            <select id="outputFormat">
                <option value="same">Сохранить как есть</option>
                <option value="webp">WebP</option>
                <option value="jpeg">JPEG</option>
                <option value="png">PNG</option>
                <option value="avif">AVIF</option>
            </select>
        </div>

        <div class="row">
            <label><input type="checkbox" id="resizeChk"> Изменить размер</label>
            <div class="grid2">
                <label>Max width: <input type="number" id="maxWidth" min="1" placeholder="например 1600" disabled></label>
                <label>Max height: <input type="number" id="maxHeight" min="1" placeholder="опционально" disabled></label>
            </div>
        </div>

        <div class="row">
            <label><input type="checkbox" id="lossless"> Lossless (без потерь)</label>
        </div>

        <div class="row">
            <label>Качество (для lossy): <span id="qVal">85</span></label>
            <input type="range" id="quality" min="30" max="100" value="85">
        </div>

        <div class="row">
            <label><input type="checkbox" id="targetChk"> Целевой вес (KB)</label>
            <input type="number" id="targetKb" min="10" step="10" placeholder="например 180" disabled>
        </div>

        <div class="row">
            <label><input type="checkbox" id="strip" checked> Удалить EXIF/метаданные</label>
            <label><input type="checkbox" id="minSize" checked> minSize</label>
            <label><input type="checkbox" id="smartSubsample" checked> smartSubsample</label>
        </div>

        <div class="row">
            <div id="summary" class="muted"></div>
        </div>

        <button type="submit" id="btn">Конвертировать</button>
        <div id="status"></div>
    </form>
</main>

<script src="app.js"></script>
</body>
</html>
